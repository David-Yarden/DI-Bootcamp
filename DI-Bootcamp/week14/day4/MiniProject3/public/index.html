<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Multiplayer Strategy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="setup">
    <input id="p1" placeholder="Player 1">
    <input id="p2" placeholder="Player 2">
    <button id="startBtn">Start Game</button>
  </div>
  <div id="game" class="hidden">
    <h3 id="turn"></h3>
    <table id="grid"></table>
    <div>
      <button data-dir="up">Up</button>
      <button data-dir="down">Down</button>
      <button data-dir="left">Left</button>
      <button data-dir="right">Right</button>
    </div>
    <h3 id="winner"></h3>
  </div>
  <script src="script.js"></script>
</body>
</html>
