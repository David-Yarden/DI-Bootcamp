<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Exercise 2 - POST Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>Contact Us</h2>

    <!--
      POST method: the form data is sent in the request body, NOT in the URL.
      The sent data does NOT appear in the address bar.
      To see it, open DevTools → Network tab → click the request → Payload tab.
    -->
    <form action="exercise2.html" method="POST">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your name" />

      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Write your message here..."></textarea>

      <input type="submit" value="Send" />
    </form>
  </div>
</body>
</html>
