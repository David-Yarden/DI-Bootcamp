<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emoji Guessing Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Emoji Guessing Game</h1>

    <div id="setup" class="card">
      <label for="player-name">Enter your name to start:</label>
      <input type="text" id="player-name" placeholder="Your name" />
      <button id="start-btn">Start Game</button>
    </div>

    <div id="game" class="card hidden">
      <div class="score-bar">
        <span>Player: <strong id="display-name"></strong></span>
        <span>Score: <strong id="score">0</strong></span>
      </div>

      <div id="emoji-display"></div>
      <p id="feedback"></p>

      <form id="guess-form">
        <div id="options"></div>
        <button type="submit">Submit Guess</button>
      </form>

      <button id="next-btn" class="hidden">Next Emoji ➜</button>
    </div>

    <div class="card" id="leaderboard-section">
      <h2>🏆 Leaderboard</h2>
      <ol id="leaderboard-list"></ol>
      <button id="refresh-lb">Refresh</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
