<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Morse Translator</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #f5f5f5; }
    h2 { margin-bottom: 16px; }
    .form-row { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type="text"] { padding: 8px 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; width: 280px; }
    button { padding: 8px 16px; font-size: 1rem; background: #3498db; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #2980b9; }
    #output { white-space: pre; font-size: 1.2rem; font-family: monospace; color: #333; background: #fff; padding: 16px; border-radius: 6px; border: 1px solid #ddd; min-height: 60px; }
    #error { color: red; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Morse Code Translator</h2>
  <div class="form-row">
    <input type="text" id="word-input" placeholder="Enter a word or sentence..." />
    <button id="translate-btn">Translate</button>
  </div>
  <div id="output"></div>
  <div id="error"></div>

  <script src="challenge2.js"></script>
</body>
</html>
